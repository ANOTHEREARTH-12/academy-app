<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="glow" cx="58%" cy="40%" r="50%">
      <stop offset="0" stop-color="#8fc4ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8fc4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fe" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e9a23b"/>
      <stop offset=".45" stop-color="#f7d08a"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <radialGradient id="ck" cx="40%" cy="35%" r="70%">
