    <path d="M25 44 L12 9 Q15.5 5.5 19 8.5 Q22.3 5 25.5 8 Q28.8 4.6 32 7.6 Q35.2 4.6 38.5 8 Q41.7 5 45 8.5 Q48.5 5.5 52 9 L39 44 Z"
