<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1830"/>
      <stop offset=".75" stop-color="#070e1d"/>
      <stop offset="1" stop-color="#050a15"/>
    </linearGradient>
    <radialGradient id="spot" cx="62%" cy="-5%" r="75%">
      <stop offset="0" stop-color="#cfe3ff" stop-opacity=".45"/>
      <stop offset=".35" stop-color="#7fb2ff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#7fb2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f2a73f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f2a73f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a30"/>
      <stop offset="1" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="fe" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e9a23b"/>
      <stop offset=".45" stop-color="#f7d08a"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <radialGradient id="ck" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfc7d4"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="wisp" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="glowf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>

    <g id="sh">
      <path d="M25 44 L12 9 Q15.5 5.5 19 8.5 Q22.3 5 25.5 8 Q28.8 4.6 32 7.6 Q35.2 4.6 38.5 8 Q41.7 5 45 8.5 Q48.5 5.5 52 9 L39 44 Z"
            fill="url(#fe)" stroke="#c9862c" stroke-width=".6" stroke-linejoin="round"/>
      <path d="M27 44 L15.5 8 M29 44 L22.5 7 M31 44 L28.8 6.5 M33 44 L35.2 6.5 M35 44 L41.7 7 M37 44 L48.5 8"
            stroke="#b97722" stroke-width=".7" stroke-linecap="round" fill="none" opacity=".85"/>
      <path d="M14 15 L50 15 M16 20 L48 20" stroke="#fffaf0" stroke-width=".35" opacity=".5"/>
      <path d="M20.2 31 Q32 35 43.8 31 M17.3 22.5 Q32 27 46.7 22.5" stroke="#d58f2f" stroke-width="1.1" fill="none" stroke-linecap="round"/>
      <rect x="24.2" y="43.2" width="15.6" height="5" rx="1.6" fill="#16213a"/>
      <path d="M25 44.6 H39" stroke="#3c8dff" stroke-width=".7" opacity=".7"/>
      <path d="M24.4 48 H39.6 V49.5 A7.6 7.6 0 0 1 24.4 49.5 Z" fill="url(#ck)"/>
      <g fill="#aab3c2" opacity=".5">
        <circle cx="28" cy="51" r=".45"/><circle cx="31" cy="53" r=".45"/><circle cx="34" cy="51.5" r=".45"/>
        <circle cx="36.5" cy="53.5" r=".45"/><circle cx="29.5" cy="55" r=".45"/><circle cx="33" cy="55.6" r=".45"/>
      </g>
    </g>
  </defs>

  <rect width="480" height="220" fill="url(#bg)"/>
  <rect width="480" height="220" fill="url(#spot)"/>

  <!-- arena lights -->
  <g fill="#e9f2ff">
    <rect x="300" y="18" width="22" height="5" rx="2.5" opacity=".75"/>
    <rect x="340" y="26" width="20" height="5" rx="2.5" opacity=".6"/>
    <rect x="376" y="33" width="18" height="4.5" rx="2.2" opacity=".45"/>
  </g>
  <g fill="#f2a73f" opacity=".5" filter="url(#glowf)">
    <circle cx="410" cy="112" r="2.5"/><circle cx="440" cy="110" r="2.5"/><circle cx="380" cy="114" r="2"/>
  </g>

  <!-- net -->
  <g opacity=".45">
    <path d="M200 98 L480 86" stroke="#e8eef8" stroke-width="2.4"/>
    <path d="M200 98 L200 150" stroke="#9fb0c8" stroke-width="1.5"/>
    <path d="M200 120 L480 112" stroke="#9fb0c8" stroke-width=".6" opacity=".6"/>
  </g>

  <!-- floor and gold court lines -->
  <path d="M0 160 L480 140 L480 220 L0 220 Z" fill="url(#floor)"/>
  <path d="M0 196 L480 168" stroke="#e8b35a" stroke-width="2.5" opacity=".75"/>
  <path d="M0 178 L480 152" stroke="#e8b35a" stroke-width="1.2" opacity=".35"/>
  <path d="M300 220 L360 146" stroke="#e8b35a" stroke-width="2" opacity=".45"/>

  <!-- blue smoke trail -->
  <g fill="none" stroke="#7fb2ff" stroke-linecap="round">
    <g filter="url(#soft)" opacity=".55">
      <path d="M190 104 C 250 70, 300 104, 360 70 S 440 24, 500 18" stroke-width="22"/>
      <path d="M195 128 C 260 108, 320 130, 380 98 S 450 60, 500 56" stroke-width="14"/>
    </g>
    <g filter="url(#wisp)" opacity=".75">
      <path d="M182 100 C 245 66, 298 98, 358 64 S 438 20, 500 12" stroke-width="1.6"/>
      <path d="M188 112 C 250 84, 304 112, 366 80 S 444 38, 500 34" stroke-width="1.1"/>
      <path d="M192 124 C 258 104, 316 124, 376 94 S 450 58, 500 52" stroke-width="1.3"/>
      <path d="M200 92 C 250 58, 290 80, 340 52 S 410 18, 470 6" stroke-width=".8"/>
      <path d="M210 134 C 270 120, 330 136, 390 110 S 460 80, 500 76" stroke-width=".8"/>
    </g>
  </g>
  <!-- gold sparks -->
  <g fill="#ffd27a">
    <circle cx="215" cy="96" r="1.8"/><circle cx="238" cy="112" r="1.2" opacity=".8"/>
    <circle cx="256" cy="86" r="1.5" opacity=".9"/><circle cx="276" cy="104" r="1" opacity=".7"/>
    <circle cx="298" cy="80" r="1.3" opacity=".8"/><circle cx="322" cy="96" r=".9" opacity=".6"/>
    <circle cx="344" cy="70" r="1.2" opacity=".7"/><circle cx="370" cy="86" r=".8" opacity=".5"/>
    <circle cx="392" cy="56" r="1" opacity=".55"/><circle cx="420" cy="62" r=".8" opacity=".45"/>
    <circle cx="228" cy="128" r="1" opacity=".7"/><circle cx="266" cy="124" r=".8" opacity=".6"/>
  </g>
  <g fill="#ffd27a" filter="url(#glowf)" opacity=".8">
    <circle cx="215" cy="96" r="3"/><circle cx="256" cy="86" r="2.5"/><circle cx="298" cy="80" r="2.2"/>
  </g>

  <!-- warm light pool + shuttle -->
  <ellipse cx="112" cy="190" rx="90" ry="16" fill="url(#pool)"/>
  <ellipse cx="104" cy="186" rx="30" ry="4" fill="#000" opacity=".45" filter="url(#glowf)"/>
  <use href="#sh" transform="translate(138 128) rotate(52) scale(2.55) translate(-32 -30)"/>
</svg>
