<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
  <title>Court Manager</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏸</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="brand"><span class="logo" aria-hidden="true">🏸</span><span id="brandName">Court Manager</span></div>
    <nav class="tabs" id="tabs" aria-label="Main">
      <a href="#bookings" data-view="bookings">Bookings</a>
      <a href="#members" data-view="members">Members</a>
      <a href="#customers" data-view="customers">Customers</a>
      <a href="#collections" data-view="collections">Collections</a>
      <a href="#expenses" data-view="expenses">Expenses</a>
      <a href="#reports" data-view="reports">Reports</a>
      <a href="#settings" data-view="settings">Settings</a>
    </nav>
    <div class="conn">
      <span id="connBadge" class="badge"></span>
      <button type="button" id="refreshBtn" class="btn ghost icon" title="Load the latest data" aria-label="Load the latest data">↻</button>
    </div>
  </header>

  <main id="view"><div class="loading center">Loading…</div></main>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript><p class="center">This app needs JavaScript turned on.</p></noscript>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pricing.js"></script>
  <script src="js/booking-modal.js"></script>
  <script src="js/views/setup.js"></script>
  <script src="js/views/bookings.js"></script>
  <script src="js/views/customers.js"></script>
  <script src="js/views/collections.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/members.js"></script>
  <script src="js/views/expenses.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
